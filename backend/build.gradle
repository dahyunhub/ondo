plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ondo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		// Spring Boot 4 가 testcontainers 버전을 관리하지 않으므로 BOM 직접 임포트
		mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	// JWT (jjwt) — 버전은 Spring Boot 가 관리하지 않으므로 명시
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// Cloud SQL for MySQL 커넥터 — Cloud Run 에서 jdbc:mysql:/// (호스트 없는) URL + socketFactory 로 연결.
	// 로컬·Docker(직접 host:port 연결)에선 미사용이지만 클래스패스에 있어도 무해하다. 버전은 Spring Boot 가 관리하지 않으므로 명시.
	implementation 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.29.0'
	// Sentry(에러 모니터링) — 코어 SDK 만 사용. Spring Boot 4 autoconfig 호환 불확실성을 피하려
	// 스타터 대신 수동 init(SentryConfig) + GlobalExceptionHandler 에서 수동 캡처한다.
	// 버전은 Spring Boot 가 관리하지 않으므로 명시.
	implementation 'io.sentry:sentry:8.52.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Testcontainers 2.x (MySQL) — 통합테스트용. 버전은 testcontainers-bom 관리
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	// MockWebServer — AiClient(OpenAI) 외부 HTTP 단위 테스트용
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
