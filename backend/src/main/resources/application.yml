server:
  # 로컬·컨테이너 공통 listen 포트(8080 → 8090, 다른 프로젝트와 충돌 회피)
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: ondo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # 로컬(non-Docker) 기본값은 3307 — 호스트 3306 은 외부 MySQL 이 점유. Docker app 은 compose 의 DB_URL(mysql:3306) 로 override.
    url: ${DB_URL:jdbc:mysql://localhost:3307/ondo?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ondo}
    password: ${DB_PASSWORD:ondo}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Flyway 가 스키마 정본. Hibernate 는 검증만 수행한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    # SMTP. 미설정이면 비-prod 는 LoggingMailSender 가 동작하므로 개발에 지장 없다.
    # 제공자를 바꿔도(Gmail → Resend/SES 등) 여기 값만 갈아끼우면 코드는 그대로다.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

ondo:
  jwt:
    # HS256 → 최소 32바이트(256bit) 키. 운영은 반드시 env 로 주입.
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  ai:
    # 외부 LLM(OpenAI). 키·모델은 운영 시 env 주입. base-url 은 호스트만(경로는 코드에서 /v1/chat/completions).
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-5.4-nano}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    max-retries: ${AI_MAX_RETRIES:2}
  kakao:
    # 카카오 OAuth. REST API 키·client_secret 은 운영 시 env 주입(코드/저장소 노출 금지).
    # client-secret 은 콘솔에서 사용함으로 설정한 경우에만 필요(미사용이면 빈 값).
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-uri: ${KAKAO_USER_URI:https://kapi.kakao.com/v2/user/me}
    timeout-seconds: ${KAKAO_TIMEOUT_SECONDS:5}
  mail:
    # 발신자 주소와 재설정 링크가 가리킬 프론트 주소.
    # 도메인을 구입하면 base-url 값만 바꾸면 된다(코드 변경 없음).
    from: ${MAIL_FROM:no-reply@ondo.local}
    base-url: ${APP_BASE_URL:http://localhost:5273}
  demo:
    # 읽기 전용 데모 계정(포트폴리오 라이브 데모). true 일 때만 데모 교사·시연 데이터가 멱등 주입되고,
    # 해당 계정의 변경 요청(POST/PUT/PATCH/DELETE)은 403(DEMO_READ_ONLY)으로 차단된다. 기본 비활성.
    enabled: ${DEMO_ENABLED:false}
    email: ${DEMO_EMAIL:demo@ondo.app}
    password: ${DEMO_PASSWORD:ondo-demo}
    name: ${DEMO_NAME:온도}
  sentry:
    # 에러 모니터링. DSN 이 비어 있으면 초기화하지 않는다(dev·테스트 완전 무동작). 운영에서만 주입.
    # 5xx 서버 오류만 GlobalExceptionHandler 에서 전송하며, PII 는 보내지 않는다(NFR-1).
    dsn: ${SENTRY_DSN:}
    environment: ${SENTRY_ENVIRONMENT:}
    release: ${SENTRY_RELEASE:}
    traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  throttle:
    # 브루트포스 가드(시도 제한). 카운터는 DB(auth_attempt)에 둔다 — Cloud Run 은 인스턴스가
    # 늘거나 잠들어서 메모리 카운터로는 보증이 되지 않는다. 값은 운영에서 env 로 조절 가능.
    login:
      # 정상 사용자가 오타로 몇 번 틀리는 것을 감안해 여유를 둔다.
      max-attempts: ${THROTTLE_LOGIN_MAX:10}
      window: ${THROTTLE_LOGIN_WINDOW:15m}
      lock-for: ${THROTTLE_LOGIN_LOCK:15m}
    password-confirm:
      # 이미 유효 토큰을 쥔 공격자가 두드리는 곳이라 더 빡빡하게.
      max-attempts: ${THROTTLE_PWD_MAX:5}
      window: ${THROTTLE_PWD_WINDOW:15m}
      lock-for: ${THROTTLE_PWD_LOCK:15m}
    reset-request:
      # 메일함 폭탄·SMTP 할당량 소진 방지. 제한에 걸리면 응답은 그대로 두고 발송만 멈춘다.
      max-attempts: ${THROTTLE_RESET_MAX:5}
      window: ${THROTTLE_RESET_WINDOW:1h}
      lock-for: ${THROTTLE_RESET_LOCK:1h}
    # 만료된 카운터 정리(KST). min-instances=0 이라 인스턴스가 자면 그날 건너뛸 수 있는 best-effort.
    cleanup-cron: ${THROTTLE_CLEANUP_CRON:0 30 4 * * *}

  feedback:
    # 인앱 피드백 알림 수신 주소. 비우면 DB(feedback 테이블)에만 적재하고 메일은 보내지 않는다.
    to: ${FEEDBACK_TO:}
  report:
    # 월말 자동 개인평가(FR-9) 실행 주기. Spring cron — L=말일.
    # 기본값 "-" = 비활성(Scheduled.CRON_DISABLED). 평가 생성은 교사 수동(POST /children/{id}/reports)으로만.
    # 자동 실행 복구: REPORT_MONTHLY_CRON 에 cron 지정(예: 0 0 2 L * * → 매월 말일 02:00 KST).
    monthly-cron: ${REPORT_MONTHLY_CRON:-}

management:
  health:
    mail:
      # 메일 health check 비활성. spring-boot-starter-mail 을 추가하면 자동 등록되는데,
      # SMTP 가 비어 있는 개발 환경에서 /actuator/health 가 통째로 DOWN 이 된다.
      # 컨테이너 healthcheck 와 deploy.sh 가 이 엔드포인트를 보므로 배포까지 막힌다.
      # 메일은 실패해도 삼키는 best-effort 의존성이라(MailSender 계약) 앱 생사와 묶지 않는다.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        show_sql: true

logging:
  level:
    com.ondo: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        show_sql: false

logging:
  level:
    com.ondo: INFO

# prod: 운영 정보 최소 노출 — health 만, 세부는 숨김.
management:
  health:
    mail:
      # 메일 health check 비활성. spring-boot-starter-mail 을 추가하면 자동 등록되는데,
      # SMTP 가 비어 있는 개발 환경에서 /actuator/health 가 통째로 DOWN 이 된다.
      # 컨테이너 healthcheck 와 deploy.sh 가 이 엔드포인트를 보므로 배포까지 막힌다.
      # 메일은 실패해도 삼키는 best-effort 의존성이라(MailSender 계약) 앱 생사와 묶지 않는다.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
