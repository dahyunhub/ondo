# 온도 프론트 서빙(Story 5.2): SPA 정적 + /api 리버스 프록시(같은 origin → 기존 상대경로 /api 그대로 동작).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 프로필 사진 업로드(서버 2MB 제한)에 여유를 둔 본문 한도.
    client_max_body_size 4m;

    # ---- 응답 압축 -------------------------------------------------------
    # nginx 공식 이미지는 gzip 이 꺼져 있어 JS·CSS·JSON 이 원본 그대로 나간다.
    # 교실에서 폰으로 쓰는 서비스라 전송량이 곧 체감 속도다.
    gzip on;
    # 프록시된 응답(=/api JSON)도 압축한다. 기본값 off 면 정적 파일만 압축된다.
    gzip_proxied any;
    # 압축본과 원본이 캐시에서 섞이지 않도록 Vary: Accept-Encoding 을 붙인다.
    gzip_vary on;
    # 6 이상은 크기 이득이 거의 없고 CPU 만 쓴다.
    gzip_comp_level 6;
    # 이보다 작은 응답은 헤더 오버헤드가 더 커서 압축이 손해다.
    gzip_min_length 1024;
    # text/html 은 nginx 가 항상 압축하므로 목록에 넣지 않는다.
    # 이미지(image/jpeg 등)는 이미 압축돼 있어 일부러 뺐다 — 프로필 사진은 그대로 나간다.
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml
        application/manifest+json;

    # SPA: 정적 파일 우선, 없으면 index.html 로 폴백(Vue history 라우팅).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: 백엔드(app:8090)로 프록시. /api 경로 그대로 전달.
    location /api/ {
        proxy_pass http://app:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 분석은 외부 LLM 호출(read 20s + 재시도)이라 기본 60s 를 넘길 수 있어 여유.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 정적 자산 캐시(해시 파일명 → 장기 캐시 안전).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
